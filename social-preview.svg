<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">CODEYAAR — Ideas into digital things</title>
<desc id="desc">CODEYAAR interlocking CY logo on a charcoal background, with the studio name and tagline.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#101112"/>
    <stop offset=".55" stop-color="#191a1c"/>
    <stop offset="1" stop-color="#242527"/>
  </linearGradient>
  <linearGradient id="mark" x1="12" y1="12" x2="88" y2="90" gradientUnits="userSpaceOnUse">
    <stop stop-color="#dedede"/>
    <stop offset=".62" stop-color="#85888b"/>
    <stop offset="1" stop-color="#b94a4a"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop stop-color="#9c3333" stop-opacity=".16"/>
